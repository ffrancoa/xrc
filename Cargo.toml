[package]
name = "xrc"
version = "0.2.2"
edition = "2024"
rust-version = "1.98"
description = "A minimal CLI to give your Rust some exercise."
license = "MIT"
repository = "https://github.com/ffrancoa/xrc"
keywords = ["cli", "contest", "sandbox", "templates"]
categories = ["command-line-utilities"]

[[bin]]
name = "xrc"
path = "src/main.rs"

[dependencies]
anstream = { version = "1.0.0" }
anstyle = { version = "1.0.14" }
anyhow = { version = "1.0.104" }
clap = { version = "4.6.6", features = ["derive", "color"] }
ego-tree = { version = "0.11" }
fancy-regex = { version = "0.19.1" }
minijinja = { version = "2.24.0" }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
regex = { version = "1.13.1" }
scraper = { version = "0.27.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
textwrap = { version = "0.16.3" }
ureq = { version = "3.4.1", features = ["json"] }
url = { version = "2.5.8" }

[dev-dependencies]
assert_cmd = { version = "2.2.2" }
insta = { version = "1.48.0" }

[profile.release]
lto = true
strip = true
codegen-units = 1
